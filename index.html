<style>

.d{position:relative;display:inline-flex;flex:none;background:#fff;border-radius:calc(var(--s)*.2);box-shadow:0 0 0 calc(var(--s)*.053) #1d2b23,0 calc(var(--s)*.08) calc(var(--s)*.13) #0005;--s:30px}

.h{width:var(--s);height:var(--s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--s)*.1)}

.board .d{position:absolute;--s:34px}

.d.mk::before{display:block;content:var(--w);position:absolute;z-index:2;left:-6px;top:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font:700 11px/17px system-ui;text-align:center;color:#2a1d00;background:var(--brass);box-shadow:0 1px 2px #0006}

@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);opacity:1}25%,80%{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9) rotate(-3deg);opacity:0}}

<body>
<div id="vp"><div id="box"><main class="stage" id="app"></main></div></div>
<script>
const SHORT=['Jij','West','Noord','Oost'],NM=['Zuid','West','Noord','Oost'],INI=['Z','W','N','O'];
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8],[0,2,3,4,5,6,8]];
const $=id=>document.getElementById(id);
const PH=PIPS.map(p=>p.map(i=>3*(2-i%3)+(i/3|0)));
const half=(n,r)=>`<span class="h">${[0,1,2,3,4,5,6,7,8].map(i=>`<b${(r?PH:PIPS)[n].includes(i)?' class="p"':''}></b>`).join('')}</span>`;
const dom=(a,b,v,c='',st='')=>`<span class="d${v?' v':''} ${c}" style="${st}">${half(a,!v)}${half(b,!v)}</span>`;
const AY=139,SS=34,GG=5.6,U=SS+GG/2,P=2*SS+GG,PD=3.5*SS+2*GG,FX=[0,-330,0,330],FY=[190,0,-170,0];
let S={bestOf:5,ccw:false,max:6,dos:true},G=null,tok=0,wins=[0,0],round=0,rw=0,rl=0,tm=0,info=false,rules=false,lvi=false,ovl=null;
// Loopbaan: je begint op niveau 1 en promoveert of degradeert na elke wedstrijd. Wordt bewaard op dit toestel.
const KEY='domino-loopbaan';
const fresh=()=>({naam:'',niv:1,master:false,cert:null,pw:0,pl:0,mw:0,ml:0,ups:0,downs:0,hist:[]});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.niv?{...fresh(),...v}:fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}}
let C=load();
const lvl=()=>C.master?LV.length:Math.min(LV.length,Math.max(1,C.niv));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Uitslag van een wedstrijd: promoveren, degraderen of (op niveau 5) het Master-certificaat
function endMatch(win){
  const from=C.niv;let to=from,kind;
  if(C.master)kind='meester';
  else if(from===1){if(win){to=2;kind='up'}else kind='stay'}
  else if(from<LV.length){if(win){to=from+1;kind='up'}else{to=from-1;kind='down'}}
  else if(win)kind='master';else{to=from-1;kind='down'}
  C.mw+=win?1:0;C.ml+=win?0:1;if(kind==='up')C.ups++;if(kind==='down')C.downs++;
  C.hist.push({van:from,w:win?1:0,pw:rw,pl:rl});
  if(!C.master)C.niv=to;
  if(kind==='master'){C.master=true;C.cert={naam:C.naam||'Speler',datum:Date.now(),hist:C.hist.slice(),mw:C.mw,ml:C.ml,pw:C.pw,pl:C.pl,ups:C.ups,downs:C.downs}}
  save();return{kind,from,to,win};
}
function restart(){C={...fresh(),naam:C.naam,cert:C.cert};save();render()}

function fit(){const b=$('box');document.documentElement.style.setProperty('--k',Math.min(b.clientWidth/844,b.clientHeight/390))}
function start(){wins=[0,0];round=0;rw=0;rl=0;ovl=null;deal()}
function reset(){G=null;tok++;wins=[0,0];round=0;ovl=null;lvi=false;render()}
function deal(){
  tok++;round++;
  const all=[];
  for(let a=0;a<=S.max;a++)for(let b=a;b<=S.max;b++)all.push({a,b});
  for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]]}
  const n=all.length/4;
  const hands=[0,1,2,3].map(k=>all.slice(k*n,k*n+n).sort((x,y)=>x.a-y.a||x.b-y.b));
  const st=hands.findIndex(h=>h.some(s=>s.a===S.max&&s.b===S.max));
  G={hands,chain:[],turn:st,passes:0,passed:[0,1,2,3].map(()=>new Set()),sel:null,over:null,hist:[],
     note:`${st?SHORT[st]+' heeft':'Jij hebt'} de dubbel ${S.max} en begint`};
  step();
}
function moves(seat){
  const h=G.hands[seat],c=G.chain,out=[];
  if(!c.length)return h.map((_,i)=>({i,side:'c'}));
  const L=c[0].a,R=c[c.length-1].b;
  h.forEach((s,i)=>{
    if(s.a===L||s.b===L)out.push({i,side:'L'});
    if(s.a===R||s.b===R)out.push({i,side:'R'});
  });
  return out;
}
function place(seat,i,side){
  const s=G.hands[seat].splice(i,1)[0],c=G.chain;
  // dos cabes: de laatste steen past aan beide kanten
  G.dos=!G.hands[seat].length&&c.length>0&&(s.a===c[0].a||s.b===c[0].a)&&(s.a===c[c.length-1].b||s.b===c[c.length-1].b);
  if(side==='c')c.push({a:s.a,b:s.b});
  else if(side==='L')c.unshift(s.b===c[0].a?{a:s.a,b:s.b}:{a:s.b,b:s.a});
  else c.push(s.a===c[c.length-1].b?{a:s.a,b:s.b}:{a:s.b,b:s.a});
  const o=side==='L'?c[0]:c[c.length-1];
  G.passes=0;G.note='';o.by=seat;G.last={seat,o};G.hist.push({seat,o});
  if(side==='c')G.anchor=o;
}
function orient(s,side){const c=G.chain;if(side==='L')return s.b===c[0].a?{a:s.a,b:s.b}:{a:s.b,b:s.a};return s.a===c[c.length-1].b?{a:s.a,b:s.b}:{a:s.b,b:s.a}}
function endsAfter(s,side){
  if(side==='c')return[s.a,s.b];
  const L=G.chain[0].a,R=G.chain[G.chain.length-1].b;
  return side==='L'?[s.b===L?s.a:s.b,R]:[L,s.a===R?s.b:s.a];
}
// Conventies (nummer = vaste code). Een niveau activeert de eerste (niveau-1) conventies van ORDER.
const CONV={

// Waar de maat naartoe speelt: af te lezen aan de stenen die hij legde (het getal dat hij open liet)
function favNums(seat){
  const c=G.chain,ai=c.indexOf(G.anchor),f=[0,0,0,0,0,0,0];
  c.forEach((s,i)=>{if(s.by!==seat)return;
    if(i===ai){f[s.a]+=s.a===s.b?2:1;if(s.a!==s.b)f[s.b]++}else f[i<ai?s.a:s.b]++});
  return f;
}
// Computerspeler: kijkt alleen naar eigen hand, tafel en wie er op welk getal gepast heeft.
// Hoger niveau = meer conventies; bij een conflict wint de conventie met de meeste impact (de eerste in ORDER).
function aiMove(seat,lv=lvl(),set=null){
  const ms=moves(seat),on=set||ORDER.slice(0,lv-1);
  if(!on.length)return ms[Math.random()*ms.length|0];
  const act=k=>on.includes(k),W=k=>12-on.indexOf(k);
  const hand=G.hands[seat],c=G.chain,P=(seat+2)%4,O=[(seat+1)%4,(seat+3)%4],N=S.ccw?(seat+3)%4:(seat+1)%4;
  const fav=act(4)?favNums(P):null,top=fav?Math.max(...fav):0,has=(t,n)=>t.a===n||t.b===n;
  let best=null,bs=-1e9;
  for(const m of ms){
    const s=hand[m.i],es=endsAfter(s,m.side),rest=hand.filter((_,j)=>j!==m.i);
    let sc=Math.random()*.5;
    if(act(2)){const cnt=[0,1,2,3,4,5,6].map(n=>rest.filter(t=>has(t,n)).length),mx=Math.max(...cnt);if(mx>=2)for(const e of es)if(cnt[e]===mx)sc+=W(2)}
    if(act(3)){const en=m.side==='L'?c[0]:m.side==='R'?c[c.length-1]:null;if(en&&en.by===P)sc-=W(3)}
    if(act(4)&&top>0)for(const e of es)if(fav[e]===top)sc+=W(4);
    if(act(5)&&s.a===s.b)sc+=W(5);
    if(act(6))for(const e of es){const dbl=c.some(t=>t.a===e&&t.b===e)||(s.a===e&&s.b===e)||rest.some(t=>t.a===e&&t.b===e);if(!dbl&&!G.passed[N].has(e))sc-=W(6)}
    if(act(7))for(const e of es)if(G.passed[P].has(e))sc-=W(7);
    if(act(8))for(const o of O)for(const e of es)if(G.passed[o].has(e))sc+=W(8);
    if(act(9))for(const e of es){const used=c.filter(t=>has(t,e)).length+(has(s,e)?1:0)+rest.filter(t=>has(t,e)).length;if(used>=7)sc+=W(9)}
    if(act(10)&&((G.passed[O[0]].has(es[0])&&G.passed[O[1]].has(es[1]))||(G.passed[O[1]].has(es[0])&&G.passed[O[0]].has(es[1]))))sc+=W(10);
    if(sc>bs){bs=sc;best=m}
  }
  return best;
}
function step(){
  render();
  clearTimeout(tm);
  if(G.over||G.turn===0||info)return;
  const t=tok;
  tm=setTimeout(()=>{if(t===tok&&G&&!G.over&&G.turn)ai()},900);
}
function ai(){
  const t=G.turn,m=aiMove(t);
  if(m){place(t,m.i,m.side);after(t)}else doPass(t);
}
function after(t){if(!G.hands[t].length)return finish(t);advance()}
function advance(){G.turn=(G.turn+(S.ccw?3:1))%4;step()}
function doPass(t){
  const c=G.chain;
  G.passed[t].add(c[0].a);G.passed[t].add(c[c.length-1].b);
  G.passes++;G.note='';G.lastPass=t;G.hist.push({seat:t});
  G.passes>=4?finish(null):advance();
}
function pick(i){
  if(G.turn||G.over)return;
  const ms=moves(0).filter(m=>m.i===i);
  if(!ms.length){G.note='Die steen past niet';return render()}
  if(G.sel===i){G.sel=null;return render()}
  const sides=ms.map(m=>m.side);
  if(sides.length===1||G.chain[0].a===G.chain[G.chain.length-1].b)return play(i,sides[sides.length-1]);
  G.sel=i;render();
}
function put(side){if(G.sel!==null)play(G.sel,side)}
function play(i,side){G.sel=null;place(0,i,side);after(0)}
function tik(){if(G.turn||G.over||moves(0).length)return;doPass(0)}
function finish(seat){
  let team,note,blk=null;
  if(seat!==null){team=seat%2;note=`${seat?SHORT[seat]+' heeft':'Jij hebt'} geen stenen meer.`}
  else{
    // Dicht: wie de minste stippen heeft, wint voor zijn team. Hebben spelers van beide teams evenveel, dan telt het teamtotaal.
    const p=[0,1,2,3].map(x=>G.hands[x].reduce((n,t)=>n+t.a+t.b,0)),mn=Math.min(...p),lows=[0,1,2,3].filter(x=>p[x]===mn);
    const a=p[0]+p[2],b=p[1]+p[3];note='Geblokkeerd.';
    if(new Set(lows.map(x=>x%2)).size===1){team=lows[0]%2;blk={how:lows.length===1?'min':'min2',lows,mn,a,b}}

  if(team===0){rw++;C.pw++}else if(team===1){rl++;C.pl++}
  const need=Math.ceil(S.bestOf/2);let career=null;
  if(wins.some(w=>w>=need))career=endMatch(wins[0]>=need);else save();

}
// Slang: twee armen vanaf de eerste steen; rechts loopt naar beneden, links naar boven.
// Dubbels liggen dwars (1 cel breed), de rest ligt (2 cellen breed). Stenen verschuiven nooit.
function arm(list,isR,x,out,cols){
  let dir=isR?1:-1,yl=0,cx=null,pd=null;
  for(const s of list){
    const w=s.a===s.b?1:2;
    if(cx!==null){x=dir>0?(w===2?cx:cx+1):(w===2?cx+1:cx);cx=null}
    if(dir>0?x+w>cols-1||(w===1&&x>cols-4):x-w<1||(w===1&&x<4)){const st=false,c=dir>0?x:x-1;out.push({s,x:c,y:yl,w:1,v:true,k:(st?2:1)*(isR?1:-1),f:false});cx=c;pd=null;yl+=(st?PD:P)*(isR?1:-1);dir=-dir;continue}
    out.push({s,x:dir>0?x:x-w,y:yl,w,v:w===1,k:0,f:(dir>0)!==isR});
    pd=w===1?(dir>0?x:x-1):null;
    x+=dir*w;
  }
}
function layout(ch,anc,cols){
  const k=ch.indexOf(anc),wa=anc.a===anc.b?1:2,x0=(cols-wa)>>1,out=[{s:anc,x:x0,y:0,w:wa,v:wa===1,k:0,f:false}];
  arm(ch.slice(k+1),true,x0+wa,out,cols);
  arm(ch.slice(0,k).reverse(),false,x0,out,cols);
  return out;
}

  const seat=s=>`<div class="abs seat ${'.wne'[s]}${G.turn===s&&!G.over?' turn':''}"><div class="bk"><span class="nm">${G.over&&sv===s?'👑 ':''}${s===2?'Noord (maat)':SHORT[s]}</span>${G.over?`<span class="pts">${tot(s)} stippen</span>`:ps.has(s)?`<div class="pas${lp===s?' pop':''}" role="img" aria-label="gepast">P</div>`:''}${bk(s)}</div></div>`;
  const ps=new Set(G.hist.slice(-3).filter(h=>!h.o).map(h=>h.seat));
  const status=G.over?'':G.sel!==null?'Kies waar de steen moet komen':G.note?G.note:G.turn?`${SHORT[G.turn]} denkt na…`:mv.length?(c.length?'Jij bent aan de beurt':'Leg een steen naar keuze'):'Je kunt niet leggen: tik op tafel';
  const t=G.over&&G.over.team;
  const sv=G.over?G.over.seat:null,tot=s=>G.hands[s].reduce((n,x)=>n+x.a+x.b,0),wt=tot(0)+tot(2),zt=tot(1)+tot(3);
  const head=!G.over?'':done?(t===0?'Wedstrijd gewonnen!':'Wedstrijd verloren'):G.over.dos?'Dos cabes!':sv===null?'Dicht!':sv===0?'Jij bent uit!':`${SHORT[sv]} is uit!`;
  const bl=G.over&&G.over.blk,blkTxt=bl?(bl.how==='min'?`${NM[bl.lows[0]]} heeft de minste stippen (${bl.mn})`:bl.how==='min2'?`${NM[bl.lows[0]]} en ${NM[bl.lows[1]]} hebben de minste stippen (${bl.mn})`:`Gelijk laagste (${bl.mn}): totaal wij ${bl.a}, zij ${bl.b}`):'';
  const sub=!G.over?'':done?`Stand: wij ${wins[0]} – ${wins[1]} zij${G.over.dos?' · dos cabes!':''}`:t===null?(bl?blkTxt+': geen punt':'Gelijk: niemand krijgt een punt'):sv===null?blkTxt:G.over.dos?`Dubbele punten voor ${t===0?'ons':'hen'}`:t===0?'Ronde voor ons':'Ronde voor hen';
  const dots=k=>`<div class="dots"><span>${k?'Zij':'Wij'}</span>${Array.from({length:need},(_,i)=>`<i class="${i<wins[k]?'on t'+k:''}"></i>`).join('')}</div>`;
  const showFx=G.over&&!G.fx;if(G.over)G.fx=true;
  const nc=showFx&&t===0?(done?90:G.over.dos?60:36):0,CC=['#e0b04a','#ef8d78','#fff','#7fd1ae','#9db8ff'];
  const fx=showFx?`<div class="abs fx"><div class="abs rib ${t===0?'':t===null?'g':'l'}">${head}<small>${sub}</small></div>${Array.from({length:nc},(_,i)=>`<i class="cf" style="left:${Math.random()*100}%;background:${CC[i%5]};animation-delay:${Math.random()*.8}s;animation-duration:${2.2+Math.random()*1.6}s"></i>`).join('')}</div>`:'';
  const cr=G.over&&G.over.career&&G.over.career.kind!=='meester';
  const endp=G.over?`<div class="abs mine"><span class="nm">${sv===0?'👑 ':''}Zuid</span><span class="pts">${tot(0)} stippen</span></div><div class="abs ctl"><h3>${head}</h3><div>${sub}</div><button class="go" onclick="${done?(cr?'showCareer()':'reset()'):'deal()'}">${done?(cr?'Verder':'Nieuwe wedstrijd'):'Volgende ronde'}</button></div>`:'';
  a.innerHTML=`<div class="abs score">${dots(0)}${dots(1)}Best of ${S.bestOf} · ronde ${round} · niveau ${lvl()} <button class="ib" onclick="toggleLvInfo()" aria-label="Uitleg van de niveaus">i</button> · ${S.ccw?'↺':'↻'}</div>
<button class="abs quit" onclick="reset()" aria-label="Stoppen">✕</button>
<button class="abs quit info" onclick="toggleInfo()" aria-label="Uitleg">i</button>
${seat(1)}${seat(2)}${seat(3)}
<div class="abs board" style="transform:translateY(${ty}px) scale(${bf});transform-origin:348px ${AY}px">${its.length?stones:'<p class="empty">De tafel is nog leeg</p>'}</div>

<div class="abs hand${G.over?' end':''}">${G.hands[0].map((s,i)=>`<button class="st${mine&&ok.has(i)?' ok':''}${mine&&!ok.has(i)?' no':''}${G.sel===i?' sel':''}" ${mine?'':'disabled'} onclick="pick(${i})" aria-label="Steen ${s.a}-${s.b}">${dom(s.a,s.b,1)}</button>`).join('')}</div>
${G.over?endp:`<div class="abs ctl"><div>${status}</div><button class="tik" onclick="tik()" ${mine&&!mv.length?'':'disabled'}>Tik op tafel (pas)</button></div>`}${fx}${infoHTML()}${lvInfoHTML()}${ovlHTML()}`;
  smooth(ty,bf,its.length);
}
fit();render();addEventListener('resize',fit);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))</script>
</body>
</html>
