<body>
<div id="vp"><div id="box"><main class="stage" id="app"></main></div></div>
<script>
const SHORT=['Jij','West','Noord','Oost'],NM=['Zuid','West','Noord','Oost'],INI=['Z','W','N','O'];
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8],[0,2,3,4,5,6,8]];
const $=id=>document.getElementById(id);
const PH=PIPS.map(p=>p.map(i=>3*(2-i%3)+(i/3|0)));
const half=(n,r)=>`<span class="h">${[0,1,2,3,4,5,6,7,8].map(i=>`<b${(r?PH:PIPS)[n].includes(i)?' class="p"':''}></b>`).join('')}</span>`;
const dom=(a,b,v,c='',st='')=>`<span class="d${v?' v':''} ${c}" style="${st}">${half(a,!v)}${half(b,!v)}</span>`;
const AY=139,SS=34,GG=5.6,U=SS+GG/2,P=2*SS+GG,PD=3.5*SS+2*GG,FX=[0,-330,0,330],FY=[190,0,-170,0];
let S={bestOf:5,ccw:false,max:6,dos:true},G=null,tok=0,wins=[0,0],round=0,rw=0,rl=0,tm=0,info=false,rules=false,lvi=false,tipOpen=false,tipLock=false,tipSent=0,hint=false,hmc=null;
// Loopbaan: je begint op niveau 1 en promoveert of degradeert na elke wedstrijd. Wordt bewaard op dit toestel.
const KEY='domino-loopbaan';
const fresh=()=>({niv:1,pw:0,pl:0,mw:0,ml:0,tips:true,v:3});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&v.niv?{...fresh(),...v}:fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}}
let C=load();
const lvl=()=>Math.min(LV.length,Math.max(1,C.niv));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Uitslag van een wedstrijd: je speelt elke wedstrijd op jouw niveau. Winnen: een niveau omhoog, verliezen: een niveau omlaag.
// Op niveau 1 blijf je bij verlies staan, op het hoogste niveau bij winst.
function endMatch(win){
  const from=C.niv;let to=from,kind;
  if(win){if(from<LV.length){to=from+1;kind='up'}else kind='top'}
  else{if(from>1){to=from-1;kind='down'}else kind='stay'}
  C.mw+=win?1:0;C.ml+=win?0:1;C.niv=to;
  save();return{kind,from,to,win};
}
// Opnieuw beginnen op niveau 1: pas bij de tweede tik, zodat het niet per ongeluk gebeurt
let rst=false,rstT=0;
function restart(){
  if(!rst){rst=true;render();clearTimeout(rstT);rstT=setTimeout(()=>{rst=false;if(!G)render()},4000);return}
  rst=false;clearTimeout(rstT);const t=C.tips;C={...fresh(),tips:t};save();render();
}

function fit(){const b=$('box');document.documentElement.style.setProperty('--k',Math.min(b.clientWidth/844,b.clientHeight/390))}
function start(){wins=[0,0];round=0;rw=0;rl=0;deal()}
function reset(){G=null;tok++;wins=[0,0];round=0;lvi=false;render()}
function deal(){
  tok++;round++;hint=false;
  const all=[];
  for(let a=0;a<=S.max;a++)for(let b=a;b<=S.max;b++)all.push({a,b});
  for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]]}
  const n=all.length/4;
  const hands=[0,1,2,3].map(k=>all.slice(k*n,k*n+n).sort((x,y)=>x.a-y.a||x.b-y.b));
  const st=hands.findIndex(h=>h.some(s=>s.a===S.max&&s.b===S.max));
  G={hands,chain:[],turn:st,lead:st,passes:0,passed:[0,1,2,3].map(()=>new Set()),sel:null,over:null,hist:[],
     note:`${st?SHORT[st]+' heeft':'Jij hebt'} de dubbel ${S.max} en begint`};
  step();
}
function moves(seat){
  const h=G.hands[seat],c=G.chain,out=[];
  if(!c.length)return h.map((_,i)=>({i,side:'c'}));
  const L=c[0].a,R=c[c.length-1].b;
  h.forEach((s,i)=>{
    if(s.a===L||s.b===L)out.push({i,side:'L'});
    if(s.a===R||s.b===R)out.push({i,side:'R'});
  });
  return out;
}
function place(seat,i,side){
  const s=G.hands[seat].splice(i,1)[0],c=G.chain;
  // dos cabes: de laatste steen past aan beide kanten
  G.dos=!G.hands[seat].length&&c.length>0&&(s.a===c[0].a||s.b===c[0].a)&&(s.a===c[c.length-1].b||s.b===c[c.length-1].b);
  if(side==='c')c.push({a:s.a,b:s.b});
  else if(side==='L')c.unshift(s.b===c[0].a?{a:s.a,b:s.b}:{a:s.b,b:s.a});
  else c.push(s.a===c[c.length-1].b?{a:s.a,b:s.b}:{a:s.b,b:s.a});
  const o=side==='L'?c[0]:c[c.length-1];
  G.passes=0;G.note='';o.by=seat;G.last={seat,o};G.hist.push({seat,o});
  if(side==='c')G.anchor=o;
}

  else if(mc)why=ev[0].v>=ev[1].v?`Beste zet: ${pct(ev[0])} kans op winst, de volgende ${pct(ev[1])}.`:`Beste zet: de meeste punten (${pct(ev[0])} winst, ${Math.round(ev[0].dos*100)}% dos cabes).`;
  else why='Beste zet: '+(WHY[bestKey(ev[0],ev[1])]||'volgens de computer')+'.';
  const row=(o,i)=>{
    const full=!(first&&i>0),rn=full?roleNote(o):'',ex=full?extraNote(o):'';
    return`<div class="hrow${i===0&&!gl?' top':''}"><div class="hh">${i===0&&!gl?'⭐':''}${dom(...turned(o),false,'m')}<span>${sideTxt(o)}</span><em>open: ${o.es.join(' · ')}${mc?` · <b>${pct(o)}</b> winst`:''}</em></div>
${full?`<div class="hl"><b>Maat:</b><span>${maatLine(o)}</span></div><div class="hl"><b>Tegenpartij:</b><span>${tegenLine(o)}</span></div>${rn?`<div class="hl"><b>Rol:</b><span>${rn}</span></div>`:''}${ex?`<div class="hl"><b>Dos/dicht:</b><span>${ex}</span></div>`:''}`:''}</div>`;
  };
  return`<div class="abs hint"><div class="hhd"><span><b>💡 Wat denkt wie?</b>${` · ${ROLES[r][1]}`}</span><button onclick="toggleHint()" aria-label="Sluiten">✕</button></div>
${top.map(row).join('')}
${first?`<div class="hwhy"><b>${openNote(ev)}</b></div>`:''}${r===3?`<div class="hwhy"><b>Conventie:</b> komt de Leider na jou, blokkeer hem.</div>`:''}<div class="hwhy">${ev.length>top.length?`En nog ${ev.length-top.length} andere ${ev.length-top.length===1?'zet':'zetten'}. `:''}${why} (advies van de computer)</div></div>`;
}
function toggleLvInfo(){lvi=!lvi;render()}
function lvInfoHTML(){
  if(!lvi)return'';
  const bar=p=>`<div class="bar"><i style="width:${p}%"></i><b></b></div>`;
  return`<div class="abs" style="inset:0;background:#0008;z-index:5" onclick="toggleLvInfo()"></div><div class="abs card infop wide"><h2>Wat doet de computer per niveau?</h2>
<p>De computer kijkt nooit in jouw stenen. Elk niveau doet ook alles van de niveaus eronder.</p>
<table class="lvt"><tr><th>Niveau</th><th>Waar let de computer op?</th><th>Tegen vorig niveau</th><th>Tegen niveau 1</th></tr>
${LV.map(([n],i)=>`<tr${i+1===lvl()?' class="now"':''}><td><b>${i+1}. ${n}</b></td><td>${INFO[i][0]}</td><td>${INFO[i][1]==null?'-':'<div class="pc"><span>'+INFO[i][1]+'% <small>(+'+(INFO[i][1]-50)+')</small></span>'+bar(INFO[i][1])+'</div>'}</td><td>${INFO[i][2]==null?'-':INFO[i][2]+'%'}</td></tr>`).join('')}</table>
<p class="fn">Winkans = % rondes dat dit niveau wint (gesimuleerd, computers aan beide kanten). 50% is even sterk. Met jou kan het afwijken.</p>
<button class="go" onclick="toggleLvInfo()">Sluiten</button></div>`;
}
function toggleInfo(){info=!info;G?step():render()}
function toggleRules(){rules=!rules;render()}
function rulesHTML(){
  if(!rules)return'';
  return`<div class="abs" style="inset:0;background:#0008;z-index:5" onclick="toggleRules()"></div><div class="abs card infop"><h2>Spelregels</h2>
<ul><li><b>Spelers:</b> vier spelers in twee teams. Jij en Noord (tegenover je) spelen tegen West en Oost.</li>
<li><b>Stenen:</b> de 28 stenen van 0 t/m 6. Iedereen krijgt er 7.</li>
<li><b>Beginnen:</b> wie de dubbel ${S.max} heeft, legt als eerste een steen naar keuze. Het hoeft niet de dubbel ${S.max} te zijn.</li>
<li><b>Beurt:</b> je speelt tegen de klok in of met de klok mee, zoals je bij het starten kiest.</li>
<li><b>Aanleggen:</b> je legt aan een van de twee uiteinden van de rij aan. Het aantal stippen moet aansluiten.</li>
<li><b>Passen:</b> kun je niet aanleggen, dan tik je op tafel en is de volgende aan de beurt.</li>
<li><b>Winnen:</b> het team waarvan een speler als eerste geen stenen meer heeft, wint de ronde en krijgt een punt.</li>
${S.dos?'<li><b>Dos cabes:</b> kon je met je laatste steen aan beide kanten aanleggen, dan tellen de punten dubbel.</li>':''}
<li><b>Dicht:</b> past niemand meer, dan wint het team van de speler met de minste stippen in de hand. Hebben twee spelers van verschillende teams evenveel, dan telt het totaal van beide teams. Is dat ook gelijk, dan krijgt niemand een punt.</li>
<li><b>Wedstrijd:</b> je speelt best of 5, 9 of 19. Wie als eerste meer dan de helft van de rondes heeft, wint de wedstrijd.</li></ul>
<h3>De Leider en de vier rollen</h3>
<p>De Leider is op elk moment de speler die als eerste uit is als iedereen vanaf dan kan aanleggen: wie de minste stenen heeft, en bij gelijk wie het eerst aan de beurt komt. De Leider kan tijdens een ronde wisselen. Bij elke naam zie je de rol van dat moment.</p>
<ul>${['Leider','Na de Leider','Maat van de Leider','Vóór de Leider'].map((n,i)=>`<li><b>${n}:</b> ${ROLES[i][2]}.</li>`).join('')}</ul>
<p><b>Conventie:</b> komt de Leider na jou, blokkeer hem. Laat de getallen liggen waar hij het minst op kan, beide uiteinden samen: getallen waarop hij paste, of waarvan de meeste stenen al liggen of bij jou zitten.</p>
<h3>Strategie</h3>
<ul><li><b>Uitkomen:</b> begin met de dubbel 6, behalve als je geen andere zes hebt en een andere dubbel waarvan je minstens twee stenen hebt. Dan begin je met die dubbel.</li>
${S.dos?'<li><b>Dos cabes:</b> bijna elke ronde kan eindigen met dubbele punten. Met twee stenen over leg je de steen waarna je laatste steen aan beide kanten past. De computer vanaf niveau 8 weegt dit mee, maar niet als een gewone winst de wedstrijd al beslist.</li>':''}
<li><b>Dichtzetten:</b> ongeveer vier op de tien rondes eindigen dicht. Een getal is dicht als alle 7 stenen ervan liggen. Het spel dichtzetten is gemiddeld geen goede zet (ongeveer 3 procentpunt minder winstkans), behalve als jouw team duidelijk de minste stippen heeft. De tip rekent het voor je uit.</li>
<li><b>Wat het meest telt:</b> getallen laten liggen waarvan bijna alle stenen gespeeld zijn, een dubbel vroeg leggen, flexibel blijven (zelf nog stenen houden die erop passen) en zware stenen eerder leggen.</li></ul>
<button class="go" onclick="toggleRules()">Sluiten</button></div>`;
}
function infoHTML(){
  if(!info)return'';
  return`<div class="abs" style="inset:0;background:#0008;z-index:5" onclick="toggleInfo()"></div><div class="abs card infop"><h2>Niveaus en promotie</h2>
<p>Je begint op niveau 1, waar de computer willekeurig speelt. Je speelt elke wedstrijd op jouw niveau. Win je, dan ga je een niveau omhoog. Verlies je, dan ga je een niveau omlaag (op niveau 1 en op niveau ${LV.length} blijf je staan als je daar respectievelijk verliest of wint). West, Oost en je maat Noord spelen alle drie op jouw niveau. Niveau 2 tot en met ${ORDER.length+1} voegen elk een conventie toe; bij een conflict wint die van het lagere niveau. Niveau ${ORDER.length+2} weegt elke zet met uitgerekende gewichten per rol. Vanaf niveau ${ORDER.length+3} rekent de computer kansen uit. Ze kijken alleen naar hun eigen stenen, de tafel en wie op welk getal paste, nooit in andermans hand.</p>
<ol>${LV.map(([n,d],i)=>`<li${i+1===lvl()?' class="now"':''}><b>${n}:</b> ${d}</li>`).join('')}</ol>
<div class="tipbtn"><button class="go" onclick="toggleInfo()">Sluiten</button><button class="lnk" onclick="toggleInfo();openTip()">💡 Tip insturen</button></div></div>`;
}
function seg(k,opts){
  return`<div class="seg">${opts.map(([v,l])=>`<button class="${S[k]===v?'on':''}" onclick="S.${k}=${v};render()">${l}</button>`).join('')}</div>`;
}
function setup(){
  const lv=lvl();
  return`<div class="abs card setup"><h1>Domino</h1><p>Jij en Noord tegen West en Oost</p>
<div class="cols"><div><b>Aantal spellen</b>${seg('bestOf',[[5,'Best of 5'],[9,'Best of 9'],[19,'Best of 19']])}
<b>Speelrichting</b>${seg('ccw',[[false,'Met de klok mee'],[true,'Tegen de klok in']])}</div>
<div class="rcol"><b>Jouw niveau</b><div class="stat"><b>${lv}. ${LV[lv-1][0]}</b></div>
<div class="stat">Elke wedstrijd speel je op dit niveau: winnen is een niveau omhoog, verliezen een niveau omlaag.</div>
${C.pw+C.pl>0?`<div class="stat">Potjes: ${C.pw} gewonnen · ${C.pl} verloren</div>`:''}
<div class="chks"><label class="chk"><input type="checkbox" ${S.dos?'checked':''} onchange="S.dos=this.checked"> Met dos cabes (dubbele punten)</label>
<label class="chk"><input type="checkbox" ${C.tips?'checked':''} onchange="C.tips=this.checked;save()"> Met tips (hulp bij je zet)</label></div></div></div>
<div class="row"><span>${C.niv>1?`<button class="lnk" onclick="restart()">${rst?'Zeker weten? Tik nogmaals':'Nieuw traject'}</button> `:''}<button class="lnk" onclick="openTip()">💡 Tip insturen</button> <button class="lnk" onclick="toggleRules()">Spelregels</button></span></div>
<button class="go" onclick="start()">Start</button></div><button class="abs quit" onclick="toggleInfo()" aria-label="Uitleg">i</button>${infoHTML()}${rulesHTML()}${lvInfoHTML()}${tipHTML()}`;
}

// Wat er na een wedstrijd met je niveau gebeurt, in één regel
const careerLine=()=>{const r=G.over&&G.over.career;if(!r)return'';
  const nm=n=>`niveau ${n}: ${LV[n-1][0]}`;
  return r.kind==='up'?`⬆ Promotie naar ${nm(r.to)}`:r.kind==='down'?`⬇ Terug naar ${nm(r.to)}`:r.kind==='stay'?`Je blijft op ${nm(1)}`:`🏆 Je blijft op het hoogste niveau: ${nm(r.to)}`;
};
function render(){
  if(tipLock)return;
  const a=$('app');
  if(!G){a.innerHTML=setup();return}
  const last=G.last;G.last=null;const lp=G.lastPass;G.lastPass=-1;
  const c=G.chain,need=Math.ceil(S.bestOf/2),done=wins.some(w=>w>=need);
  const mv=moves(0),ok=new Set(mv.map(m=>m.i)),mine=G.turn===0&&!G.over;
  const dup=c.length&&c[0].a===c[c.length-1].b;
  const ev=mine&&C.tips?evalMoves(0,ORDER).filter(o=>!(dup&&o.m.side==='R')):[];
  if(hint&&hmc)for(const o of ev){const x=hmc.find(z=>z.m.i===o.m.i&&z.m.side===o.m.side);if(x){o.v=x.v;o.p=S.dos?x.w:x.v;o.dos=x.dos;o.dosT=x.dosTegen;o.dicht=x.dicht}else o.p=null}
  ev.sort((x,y)=>x.p!=null&&y.p!=null?(y.p-x.p)||(y.sc-x.sc):y.sc-x.sc);
  const canHint=ev.length>=2,best=hint&&canHint&&(ev[0].p!=null?ev[0].p-ev[1].p>=(S.dos?.025:.03):ev[0].sc-ev[1].sc>=.8)?ev[0]:null;
  const sel=G.sel!==null?mv.filter(m=>m.i===G.sel).map(m=>m.side):[];
  const ghost=side=>({...orient(G.hands[0][G.sel],side),g:side});
  const ch=c.length?[...(sel.includes('L')?[ghost('L')]:[]),...c,...(sel.includes('R')?[ghost('R')]:[])]:[];
  const cols=G.anchor&&G.anchor.a===G.anchor.b?17:18,ox=(696-cols*U)/2;
  const its=ch.length?layout(ch,G.anchor,cols):[];
  // Zeer lange kettingen: het bord schaalt mee rond de beginsteen, zodat niets over de rest heen valt
  const ext=its.map(i=>{const h=i.v?2*SS:SS,t=AY+i.y+(i.k===1?-SS/2:i.k===-1?-1.5*SS:i.k===2?SS+GG:i.k===-2?-(3*SS+GG):-h/2);return[t,t+h]});
  // Het bord past zich aan de slang aan: eerst schuiven (alleen als het moet), pas daarna krimpen
  const etop=Math.min(...ext.map(e=>e[0])),ebot=Math.max(...ext.map(e=>e[1]));
  const bf=its.length?Math.max(.55,Math.min(1,248/(ebot-etop))):1;
  const sT=AY+(etop-AY)*bf,sB=AY+(ebot-AY)*bf,ty=its.length?(sT<10?10-sT:sB>258?258-sB:0):0;
  const who=new Map(G.hist.slice(-3).filter(h=>h.o).map(h=>[h.o,h.seat]));
  a.style.setProperty('--hs',SS*bf+'px');
  const stones=its.map(i=>{
    const o=i.s,[p,q]=i.f?[o.b,o.a]:[o.a,o.b],dw=i.v?SS:2*SS,dh=i.v?2*SS:SS;
    const px=ox+i.x*U+(i.w*U-dw)/2,py=AY+i.y+(i.k===1?-SS/2:i.k===-1?-1.5*SS:i.k===2?SS+GG:i.k===-2?-(3*SS+GG):-dh/2),pos=`left:${px}px;top:${py}px`;
    if(o.g)return`<button class="gh" style="${pos};width:${dw}px;height:${dh}px" onclick="put('${o.g}')" aria-label="Hier aanleggen">${dom(p,q,i.v,'g')}</button>`;
    const nw=last&&last.o===o,fv=nw?`--fx:${FX[last.seat]}px;--fy:${FY[last.seat]}px;`:'',own=o.by,side=i.k===2||i.k===-2;
    const bx=side?(i.k>0?px-17:px+dw+2):px+dw/2-8,by=side?py+dh/2-8:i.k===1?py-17:py+dh+2;
    return dom(p,q,i.v,nw?'new':'',fv+pos)+(G.over||who.has(o)?`<span class="pl t${own%2}${who.has(o)?' rc':''}${nw?' new':''}" style="${fv}left:${bx}px;top:${by}px">${INI[own]}</span>`:'');
  }).join('');
  const bk=s=>G.over?G.hands[s].map(t=>dom(t.a,t.b,false,'r')).join(''):'<i></i>'.repeat(G.hands[s].length);
  const rl=s=>`<small class="rl">· ${ROLES[roleOf(s)][0]}</small>`;
  const seat=s=>`<div class="abs seat ${'.wne'[s]}${G.turn===s&&!G.over?' turn':''}"><div class="bk"><span class="nm">${G.over&&sv===s?'👑 ':''}${s===2?'Noord (maat)':SHORT[s]}${rl(s)}</span>${G.over?`<span class="pts">${tot(s)} stippen</span>`:ps.has(s)?`<div class="pas${lp===s?' pop':''}" role="img" aria-label="gepast">P</div>`:''}${bk(s)}</div></div>`;
  const ps=new Set(G.hist.slice(-3).filter(h=>!h.o).map(h=>h.seat));
  const status=G.over?'':G.sel!==null?'Kies waar de steen moet komen':G.note?G.note:G.turn?`${SHORT[G.turn]} denkt na…`:mv.length?(c.length?'Jij bent aan de beurt':'Leg een steen naar keuze'):'Je kunt niet leggen: tik op tafel';
  const t=G.over&&G.over.team;
  const sv=G.over?G.over.seat:null,tot=s=>G.hands[s].reduce((n,x)=>n+x.a+x.b,0),wt=tot(0)+tot(2),zt=tot(1)+tot(3);
  const head=!G.over?'':done?(t===0?'Wedstrijd gewonnen!':'Wedstrijd verloren'):G.over.dos?'Dos cabes!':sv===null?'Dicht!':sv===0?'Jij bent uit!':`${SHORT[sv]} is uit!`;
  const bl=G.over&&G.over.blk,blkTxt=bl?(bl.how==='min'?`${NM[bl.lows[0]]} heeft de minste stippen (${bl.mn})`:bl.how==='min2'?`${NM[bl.lows[0]]} en ${NM[bl.lows[1]]} hebben de minste stippen (${bl.mn})`:`Gelijk laagste (${bl.mn}): totaal wij ${bl.a}, zij ${bl.b}`):'';
  const sub=!G.over?'':done?`Stand: wij ${wins[0]} – ${wins[1]} zij${G.over.dos?' · dos cabes!':''}`:t===null?(bl?blkTxt+': geen punt':'Gelijk: niemand krijgt een punt'):sv===null?blkTxt:G.over.dos?`Dubbele punten voor ${t===0?'ons':'hen'}`:t===0?'Ronde voor ons':'Ronde voor hen';
  const dots=k=>`<div class="dots"><span>${k?'Zij':'Wij'}</span>${Array.from({length:need},(_,i)=>`<i class="${i<wins[k]?'on t'+k:''}"></i>`).join('')}</div>`;
  const showFx=G.over&&!G.fx;if(G.over)G.fx=true;
  const nc=showFx&&t===0?(G.over.dos?60:36):0,CC=['#e0b04a','#ef8d78','#fff','#7fd1ae','#9db8ff'];
  const fx=showFx?`<div class="abs fx"><div class="abs rib ${t===0?'':t===null?'g':'l'}">${head}<small>${sub}</small></div>${Array.from({length:nc},(_,i)=>`<i class="cf" style="left:${Math.random()*100}%;background:${CC[i%5]};animation-delay:${Math.random()*.8}s;animation-duration:${2.2+Math.random()*1.6}s"></i>`).join('')}</div>`:'';
    const endp=G.over?`<div class="abs mine"><span class="nm">${sv===0?'👑 ':''}Zuid${rl(0)}</span><span class="pts">${tot(0)} stippen</span></div><div class="abs ctl endc"><h3>${head}</h3><div>${sub}</div>${done?`<div class="lvn">${careerLine()}</div>`:''}<button class="go" onclick="${done?'start()':'deal()'}">${done?'Volgende wedstrijd':'Volgende ronde'}</button></div>`:'';
  a.innerHTML=`<div class="abs score">${dots(0)}${dots(1)}Best of ${S.bestOf} · ronde ${round} · niveau ${lvl()} <button class="ib" onclick="toggleLvInfo()" aria-label="Uitleg van de niveaus">i</button> · ${S.ccw?'↺':'↻'}</div>
<button class="abs quit" onclick="reset()" aria-label="Stoppen">✕</button>
<button class="abs quit info" onclick="toggleInfo()" aria-label="Uitleg">i</button>
${seat(1)}${seat(2)}${seat(3)}
<div class="abs board" style="transform:translateY(${ty}px) scale(${bf});transform-origin:348px ${AY}px">${its.length?stones:'<p class="empty">De tafel is nog leeg</p>'}</div>

<div class="abs hand${G.over?' end':''}">${G.hands[0].map((s,i)=>`<button class="st${mine&&ok.has(i)?' ok':''}${mine&&!ok.has(i)?' no':''}${G.sel===i?' sel':''}${best&&best.m.i===i?' best':''}" ${mine?'':'disabled'} onclick="pick(${i})" aria-label="Steen ${s.a}-${s.b}">${dom(s.a,s.b,1)}</button>`).join('')}</div>
${G.over?endp:`<div class="abs mine lift${G.turn===0?' turn':''}"><span class="nm">Zuid${rl(0)}</span></div><div class="abs ctl"><div>${status}</div><div class="cbtn">${C.tips?`<button class="hintb${canHint?' on':''}" onclick="toggleHint()" ${canHint?'':'disabled'} aria-label="Tip: wat denken je maat en de tegenstanders?">💡</button>`:''}<button class="tik" onclick="tik()" ${mine&&!mv.length?'':'disabled'}>Tik op tafel (pas)</button></div></div>`}${fx}${hintHTML(ev)}${infoHTML()}${lvInfoHTML()}${tipHTML()}`;
  smooth(ty,bf,its.length);
}
fit();render();addEventListener('resize',fit);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))</script>
