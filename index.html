<style>
:root{--bg:#cfdcd3;--ink:#14231b;--card:#f4f8f5;--line:#b8c7bd;--felt:#2c7a4f;--felt2:#1f5a3b;--brass:#e0b04a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b120e;--ink:#e6efe9;--card:#18241d;--line:#2d4236;--felt:#1d5035;--felt2:#143826}}
:root[data-theme="dark"]{--bg:#0b120e;--ink:#e6efe9;--card:#18241d;--line:#2d4236;--felt:#1d5035;--felt2:#143826}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.3 "Trebuchet MS",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#vp{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}

@media (orientation:portrait){#box::after{content:"Draai je telefoon: dit spel is gemaakt voor liggend";position:absolute;left:0;right:0;top:6px;text-align:center;font-size:13px}}
.stage{position:absolute;left:50%;top:50%;width:844px;height:390px;margin:-195px 0 0 -422px;transform:scale(var(--k,1));border-radius:14px;overflow:hidden;color:#f2f7f3;background:radial-gradient(ellipse at center,var(--felt),var(--felt2))}
.abs{position:absolute}

.setup{left:50%;top:50%;transform:translate(-50%,-50%);width:540px}
.seg{display:flex;gap:6px;margin:4px 0 10px}

@keyframes padpop{from{transform:scale(.2) rotate(-25deg);opacity:0}}

.infop{left:50%;top:50%;transform:translate(-50%,-50%);width:680px;max-height:360px;overflow:auto;text-align:left;font-size:13px;z-index:6}

.nm{display:inline-block;padding:1px 8px;border-radius:9px;background:#0005;margin-bottom:3px}
.turn .nm{background:var(--brass);color:#2a1d00;font-weight:700}
.n{left:50%;top:27px;transform:translateX(-50%)}
.w{left:6px;top:181px;transform:translateY(-50%)}
.e{right:6px;top:181px;transform:translateY(-50%)}
.seat .nm{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:3px;white-space:nowrap}
.seat .pts{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;white-space:nowrap}
.bk{position:relative;display:flex;gap:3px;justify-content:center}
.w .bk,.e .bk{flex-direction:column;align-items:center}
.bk i{width:20px;height:36px;border-radius:4px;background:#f7f7f2;box-shadow:0 0 0 1.5px #1d2b23}
.w .bk i,.e .bk i{width:38px;height:16px}
.board{left:74px;top:56px;width:696px;height:250px}
.empty{position:absolute;inset:0;display:grid;place-items:center;margin:0;opacity:.8}
.hist{left:12px;bottom:8px;width:240px}
.hist small{display:block;opacity:.85;margin-bottom:2px}
.mv{display:flex;align-items:center;gap:8px;height:24px}
.mv>b{min-width:52px;text-align:center;padding:1px 6px;border-radius:9px;font-size:12px;color:#2a1d00;background:var(--brass)}
.mv>b.t1,.d.mk.t1::before{background:#ef8d78}
.hand{left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:6px}
.ctl{right:12px;bottom:10px;width:250px;text-align:right}
.d{position:relative;display:inline-flex;flex:none;background:#fff;border-radius:calc(var(--s)*.2);box-shadow:0 0 0 2px #1d2b23,0 3px 5px #0005;--s:30px}
.d.v{flex-direction:column}
.d::after{content:"";position:absolute;left:50%;top:10%;bottom:10%;width:2px;transform:translateX(-50%);background:#1d2b23}
.d.v::after{left:10%;right:10%;top:50%;bottom:auto;width:auto;height:2px;transform:translateY(-50%)}
.d::before{display:none}
.d.m{--s:12px;box-shadow:0 0 0 1px #1d2b23}
.d.r{--s:26px}
.mv .d{--s:18px}
.h{width:var(--s);height:var(--s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10%}
.h b{width:86%;height:86%;margin:auto;border-radius:50%}
.h b.p{background:#161c18}
.board .d{position:absolute;--s:26px}
.hand .d{--s:31px}
.hand.end .d{--s:26px}
.d.mk::before{display:block;content:var(--w);position:absolute;z-index:2;left:-6px;top:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;font:700 11px/17px system-ui;text-align:center;color:#2a1d00;background:var(--brass);box-shadow:0 1px 2px #0006}
.gh{position:absolute;padding:0;border:0;background:none;animation:pulse 1s infinite}
.gh .d{left:0;top:0;opacity:.85;outline:2px dashed var(--brass);outline-offset:3px}
@keyframes pulse{50%{transform:scale(1.07)}}
.d.new,.pl.new{animation:drop .6s cubic-bezier(.2,.8,.25,1)}
@keyframes drop{from{transform:translate(var(--fx),var(--fy)) scale(1.2);opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.d.new,.pl.new,.gh,.pas.pop{animation:none}.cf,.rib{display:none}}
.st{padding:0;border:0;background:none;border-radius:8px;transition:transform .12s}
.st:disabled{cursor:default}
.st.ok{transform:translateY(-8px)}
.st.ok .d{box-shadow:0 0 0 3px var(--brass),0 3px 6px #0004}
.st.sel{transform:translateY(-14px)}
.st.no{opacity:.45}
.tik{margin-top:6px;padding:9px 16px;border-radius:10px;border:2px solid #fff8;background:transparent;color:#fff}
.tik:not(:disabled){background:var(--brass);color:#2a1d00;border-color:var(--brass);font-weight:700}
.tik:disabled{opacity:.45;cursor:default}
.res{left:50%;top:48%;transform:translate(-50%,-50%);width:380px;z-index:5}
.pl{position:absolute;min-width:15px;height:15px;padding:0 3px;border-radius:8px;font:700 10px/15px system-ui;text-align:center;color:#2a1d00;background:var(--brass);box-shadow:0 1px 2px #0006}
.pl.t1{background:#ef8d78}
.pl.rc{outline:2px solid #fff}
.pts{display:block;font-size:11px;opacity:.9}
.mine{left:50%;bottom:62px;transform:translateX(-50%);text-align:center}
.fx{inset:0;pointer-events:none;z-index:7;overflow:hidden}
.rib{left:50%;top:44%;padding:8px 34px 10px;border-radius:14px;font-size:38px;font-weight:800;line-height:1.1;text-align:center;white-space:nowrap;color:#2a1d00;background:var(--brass);box-shadow:0 8px 0 #0004;animation:pop 2.8s both}
.rib.l{background:#ef8d78}
.rib.g{background:#c9d8ce}
.rib small{display:block;font-size:15px;font-weight:600}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15) rotate(-3deg);opacity:1}25%,80%{transform:translate(-50%,-50%) scale(1) rotate(-3deg);opacity:1}100%{transform:translate(-50%,-50%) scale(.9) rotate(-3deg);opacity:0}}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 3s linear both}
@keyframes fall{to{transform:translateY(440px) rotate(540deg)}}
.ctl h3{margin:0;font-size:20px}
.dots{display:flex;gap:4px;align-items:center;margin:2px 0}
.dots span{min-width:30px;font-size:15px;font-weight:700}
.dots i{width:11px;height:11px;border-radius:50%;border:2px solid #fff9}
.dots i.on{background:var(--brass);border-color:var(--brass)}
.dots i.on.t1{background:#ef8d78;border-color:#ef8d78}
</style>

<body>
<div id="vp"><div id="box"><main class="stage" id="app"></main></div></div>
<script>
const SHORT=['Jij','West','Noord','Oost'],NM=['Zuid','West','Noord','Oost'],INI=['Z','W','N','O'];
const PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8],[0,2,3,4,5,6,8]];
const $=id=>document.getElementById(id);
const half=n=>`<span class="h">${[0,1,2,3,4,5,6,7,8].map(i=>`<b${PIPS[n].includes(i)?' class="p"':''}></b>`).join('')}</span>`;
const dom=(a,b,v,c='',st='')=>`<span class="d${v?' v':''} ${c}" style="${st}">${half(a)}${half(b)}</span>`;
const SS=26,GG=6,U=SS+GG/2,P=2*SS+GG,PD=3.5*SS+2*GG,FX=[0,-330,0,330],FY=[190,0,-170,0];
let S={bestOf:5,ccw:true,max:6,dos:true},G=null,tok=0,wins=[0,0],round=0,tm=0,info=false,rules=false;

function fit(){const b=$('box');document.documentElement.style.setProperty('--k',Math.min(b.clientWidth/844,b.clientHeight/390))}
function start(){wins=[0,0];round=0;deal()}
function reset(){G=null;tok++;wins=[0,0];round=0;render()}
function deal(){
  tok++;round++;
  const all=[];
  for(let a=0;a<=S.max;a++)for(let b=a;b<=S.max;b++)all.push({a,b});
  for(let i=all.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[all[i],all[j]]=[all[j],all[i]]}
  const n=all.length/4;
  const hands=[0,1,2,3].map(k=>all.slice(k*n,k*n+n).sort((x,y)=>x.a-y.a||x.b-y.b));
  const st=hands.findIndex(h=>h.some(s=>s.a===S.max&&s.b===S.max));
  G={hands,chain:[],turn:st,passes:0,passed:[0,1,2,3].map(()=>new Set()),sel:null,over:null,hist:[],
     note:`${st?SHORT[st]+' heeft':'Jij hebt'} de dubbel ${S.max} en begint`};
  step();
}
function moves(seat){
  const h=G.hands[seat],c=G.chain,out=[];
  if(!c.length)return h.map((_,i)=>({i,side:'c'}));
  const L=c[0].a,R=c[c.length-1].b;
  h.forEach((s,i)=>{
    if(s.a===L||s.b===L)out.push({i,side:'L'});
    if(s.a===R||s.b===R)out.push({i,side:'R'});
  });
  return out;
}
function place(seat,i,side){
  const s=G.hands[seat].splice(i,1)[0],c=G.chain;
  // dos cabes: de laatste steen past aan beide kanten
  G.dos=!G.hands[seat].length&&c.length>0&&(s.a===c[0].a||s.b===c[0].a)&&(s.a===c[c.length-1].b||s.b===c[c.length-1].b);
  if(side==='c')c.push({a:s.a,b:s.b});
  else if(side==='L')c.unshift(s.b===c[0].a?{a:s.a,b:s.b}:{a:s.b,b:s.a});
  else c.push(s.a===c[c.length-1].b?{a:s.a,b:s.b}:{a:s.b,b:s.a});
  const o=side==='L'?c[0]:c[c.length-1];
  G.passes=0;G.note='';o.by=seat;G.last={seat,o};G.hist.push({seat,o});
  if(side==='c')G.anchor=o;
}
function orient(s,side){const c=G.chain;if(side==='L')return s.b===c[0].a?{a:s.a,b:s.b}:{a:s.b,b:s.a};return s.a===c[c.length-1].b?{a:s.a,b:s.b}:{a:s.b,b:s.a}}
function endsAfter(s,side){
  if(side==='c')return[s.a,s.b];
  const L=G.chain[0].a,R=G.chain[G.chain.length-1].b;
  return side==='L'?[s.b===L?s.a:s.b,R]:[L,s.a===R?s.b:s.a];
}
// Computerspeler: kijkt alleen naar eigen hand, tafel en wie er gepast heeft
function aiMove(seat){
  let best=null,bs=-1e9;
  for(const m of moves(seat)){
    const s=G.hands[seat][m.i],es=endsAfter(s,m.side);
    const rest=G.hands[seat].filter((_,j)=>j!==m.i);
    let sc=s.a+s.b+(s.a===s.b?4:0)+Math.random();
    sc+=rest.filter(t=>es.some(e=>t.a===e||t.b===e)).length*3;
    const en=m.side==='L'?G.chain[0]:m.side==='R'?G.chain[G.chain.length-1]:null;
    if(en&&en.by===(seat+2)%4)sc-=5;
    for(const e of es){
      if(G.passed[(seat+1)%4].has(e))sc+=2;
      if(G.passed[(seat+3)%4].has(e))sc+=2;
      if(G.passed[(seat+2)%4].has(e))sc-=3;
    }
    if(sc>bs){bs=sc;best=m}
  }
  return best;
}
function step(){
  render();
  clearTimeout(tm);
  if(G.over||G.turn===0||info)return;
  const t=tok;
  tm=setTimeout(()=>{if(t===tok&&G&&!G.over&&G.turn)ai()},900);
}
function ai(){
  const t=G.turn,m=aiMove(t);
  if(m){place(t,m.i,m.side);after(t)}else doPass(t);
}
function after(t){if(!G.hands[t].length)return finish(t);advance()}
function advance(){G.turn=(G.turn+(S.ccw?3:1))%4;step()}
function doPass(t){
  const c=G.chain;
  G.passed[t].add(c[0].a);G.passed[t].add(c[c.length-1].b);
  G.passes++;G.note='';G.lastPass=t;G.hist.push({seat:t});
  G.passes>=4?finish(null):advance();
}
function pick(i){
  if(G.turn||G.over)return;
  const ms=moves(0).filter(m=>m.i===i);
  if(!ms.length){G.note='Die steen past niet';return render()}
  if(G.sel===i){G.sel=null;return render()}
  const sides=ms.map(m=>m.side);
  if(sides.length===1||G.chain[0].a===G.chain[G.chain.length-1].b)return play(i,sides[sides.length-1]);
  G.sel=i;render();
}
function put(side){if(G.sel!==null)play(G.sel,side)}
function play(i,side){G.sel=null;place(0,i,side);after(0)}
function tik(){if(G.turn||G.over||moves(0).length)return;doPass(0)}
function finish(seat){
  let team,note;
  if(seat!==null){team=seat%2;note=`${seat?SHORT[seat]+' heeft':'Jij hebt'} geen stenen meer.`}
  else{
    const sum=k=>[k,k+2].reduce((n,s)=>n+G.hands[s].reduce((x,y)=>x+y.a+y.b,0),0);
    const a=sum(0),b=sum(1);
    team=a<b?0:b<a?1:null;
    note=`Geblokkeerd. Stippen in de hand: wij ${a}, zij ${b}.`+(team===null?' Gelijk: geen punt.':' Het laagste telt.');
  }
  const dos=S.dos&&seat!==null&&!!G.dos;if(team!==null)wins[team]+=dos?2:1;
  G.over={team,note,seat,dos};render();
}
// Slang: twee armen vanaf de eerste steen; rechts loopt naar beneden, links naar boven.
// Dubbels liggen dwars (1 cel breed), de rest ligt (2 cellen breed). Stenen verschuiven nooit.
function arm(list,isR,x,out,cols){
  let dir=isR?1:-1,yl=0,cx=null,pd=null;
  for(const s of list){
    const w=s.a===s.b?1:2;
    if(cx!==null){x=dir>0?(w===2?cx:cx+1):(w===2?cx+1:cx);cx=null}
    if(dir>0?x+w>cols-1:x-w<1){const st=pd!==null,c=st?pd:dir>0?x:x-1;out.push({s,x:c,y:yl,w:1,v:true,k:(st?2:1)*(isR?1:-1),f:false});cx=c;pd=null;yl+=(st?PD:P)*(isR?1:-1);dir=-dir;continue}
    out.push({s,x:dir>0?x:x-w,y:yl,w,v:w===1,k:0,f:(dir>0)!==isR});
    pd=w===1?(dir>0?x:x-1):null;
    x+=dir*w;
  }
}
function layout(ch,anc,cols){
  const k=ch.indexOf(anc),wa=anc.a===anc.b?1:2,x0=(cols-wa)>>1,out=[{s:anc,x:x0,y:0,w:wa,v:wa===1,k:0,f:false}];
  arm(ch.slice(k+1),true,x0+wa,out,cols);
  arm(ch.slice(0,k).reverse(),false,x0,out,cols);
  return out;
}
function toggleInfo(){info=!info;G?step():render()}
function toggleRules(){rules=!rules;render()}
function rulesHTML(){
  if(!rules)return'';
  return`<div class="abs" style="inset:0;background:#0008;z-index:5" onclick="toggleRules()"></div><div class="abs card infop"><h2>Spelregels</h2>
<ul><li><b>Spelers:</b> vier spelers in twee teams. Jij en Noord (tegenover je) spelen tegen West en Oost.</li>
<li><b>Stenen:</b> de 28 stenen van 0 t/m 6. Iedereen krijgt er 7.</li>
<li><b>Beginnen:</b> wie de dubbel ${S.max} heeft, legt als eerste een steen naar keuze. Het hoeft niet de dubbel ${S.max} te zijn.</li>
<li><b>Beurt:</b> je speelt tegen de klok in of met de klok mee, zoals je bij het starten kiest.</li>
<li><b>Aanleggen:</b> je legt aan een van de twee uiteinden van de rij aan. Het aantal stippen moet aansluiten.</li>
<li><b>Passen:</b> kun je niet aanleggen, dan tik je op tafel en is de volgende aan de beurt.</li>
<li><b>Winnen:</b> het team waarvan een speler als eerste geen stenen meer heeft, wint de ronde en krijgt een punt.</li>
${S.dos?'<li><b>Dos cabes:</b> kon je met je laatste steen aan beide kanten aanleggen, dan tellen de punten dubbel.</li>':''}
<li><b>Dicht:</b> past niemand meer, dan wint het team met de minste stippen in de hand. Bij gelijkspel krijgt niemand een punt.</li>
<li><b>Wedstrijd:</b> je speelt best of 5, 9 of 19. Wie als eerste meer dan de helft van de rondes heeft, wint de wedstrijd.</li></ul>
<button class="go" onclick="toggleRules()">Sluiten</button></div>`;
}
function infoHTML(){
  if(!info)return'';
  return`<div class="abs" style="inset:0;background:#0008;z-index:5" onclick="toggleInfo()"></div><div class="abs card infop"><h2>Zo kiezen de computerspelers</h2>
<p>West, Oost en je maat Noord kijken alleen naar hun eigen stenen, de stenen op tafel en wie er op welk cijfer gepast heeft. Voor elke steen die past, per kant waar hij kan liggen, rekenen ze een score uit. De hoogste score wint.</p>
<ul><li><b>Zware stenen eerst:</b> het aantal stippen telt mee, want bij een geblokkeerd spel wint het laagste aantal.</li>
<li><b>Dubbels vroeg:</b> een dubbel levert extra punten op, omdat je die later moeilijk kwijtraakt.</li>
<li><b>Opties openhouden:</b> elke andere steen in hun hand die na de zet nog kan aanleggen, levert punten op.</li>
<li><b>Passen onthouden:</b> wie past, heeft dat cijfer niet. Een cijfer waar een tegenstander op gepast heeft, laten ze liever open liggen. Een cijfer waar hun maat op gepast heeft, liever niet.</li>
<li><b>Niet op de steen van je maat:</b> ze leggen liever niet aan op de open kant van een steen die hun maat heeft gelegd. Die kant heeft de maat misschien zelf nodig.</li>
<li><b>Een beetje toeval:</b> een kleine willekeurige waarde zorgt voor variatie. Ze passen alleen als er echt geen steen past.</li></ul>
<p>Ze plannen niet vooruit, houden niet bij welke cijfers al op zijn en geven geen seintjes aan hun maat. Redelijk, maar te verslaan.</p>
<button class="go" onclick="toggleInfo()">Sluiten</button></div>`;
}
function seg(k,opts){
  return`<div class="seg">${opts.map(([v,l])=>`<button class="${S[k]===v?'on':''}" onclick="S.${k}=${v};render()">${l}</button>`).join('')}</div>`;
}
function setup(){
  return`<div class="abs card setup"><h1>Domino</h1><p>Jij en Noord tegen West en Oost</p>
<b>Aantal spellen</b>${seg('bestOf',[[5,'Best of 5'],[9,'Best of 9'],[19,'Best of 19']])}
<b>Speelrichting</b>${seg('ccw',[[true,'Tegen de klok in'],[false,'Met de klok mee']])}
<label class="chk"><input type="checkbox" ${S.dos?'checked':''} onchange="S.dos=this.checked"> Met dos cabes (dubbele punten)</label>
<button class="lnk" onclick="toggleRules()">Spelregels</button>
<button class="go" onclick="start()">Start</button></div><button class="abs quit" onclick="toggleInfo()" aria-label="Uitleg">i</button>${infoHTML()}${rulesHTML()}`;
}
function render(){
  const a=$('app');
  if(!G){a.innerHTML=setup();return}
  const last=G.last;G.last=null;const lp=G.lastPass;G.lastPass=-1;
  const c=G.chain,need=Math.ceil(S.bestOf/2),done=wins.some(w=>w>=need);
  const mv=moves(0),ok=new Set(mv.map(m=>m.i)),mine=G.turn===0&&!G.over;
  const sel=G.sel!==null?mv.filter(m=>m.i===G.sel).map(m=>m.side):[];
  const ghost=side=>({...orient(G.hands[0][G.sel],side),g:side});
  const ch=c.length?[...(sel.includes('L')?[ghost('L')]:[]),...c,...(sel.includes('R')?[ghost('R')]:[])]:[];
  const cols=G.anchor&&G.anchor.a===G.anchor.b?23:24,ox=(696-cols*U)/2;
  const its=ch.length?layout(ch,G.anchor,cols):[];
  // Zeer lange kettingen: het bord schaalt mee rond de beginsteen, zodat niets over de rest heen valt
  const bf=Math.max(.55,Math.min(1,...its.map(i=>{const h=i.v?2*SS:SS,t=125+i.y+(i.k===1?-SS/2:i.k===-1?-1.5*SS:i.k===2?SS+GG:i.k===-2?-(3*SS+GG):-h/2);return Math.min(125/Math.max(125-t,1),125/Math.max(t+h-125,1))})));
  const who=new Map(G.hist.slice(-3).filter(h=>h.o).map(h=>[h.o,h.seat]));
  const stones=its.map(i=>{
    const o=i.s,[p,q]=i.f?[o.b,o.a]:[o.a,o.b],dw=i.v?SS:2*SS,dh=i.v?2*SS:SS;
    const px=ox+i.x*U+(i.w*U-dw)/2,py=125+i.y+(i.k===1?-SS/2:i.k===-1?-1.5*SS:i.k===2?SS+GG:i.k===-2?-(3*SS+GG):-dh/2),pos=`left:${px}px;top:${py}px`;
    if(o.g)return`<button class="gh" style="${pos};width:${dw}px;height:${dh}px" onclick="put('${o.g}')" aria-label="Hier aanleggen">${dom(p,q,i.v,'g')}</button>`;
    const nw=last&&last.o===o,fv=nw?`--fx:${FX[last.seat]}px;--fy:${FY[last.seat]}px;`:'',own=o.by,side=i.k===2||i.k===-2;
    const bx=side?(i.k>0?px-17:px+dw+2):px+dw/2-8,by=side?py+dh/2-8:i.k===1?py-17:py+dh+2;
    return dom(p,q,i.v,nw?'new':'',fv+pos)+(G.over||who.has(o)?`<span class="pl t${own%2}${who.has(o)?' rc':''}${nw?' new':''}" style="${fv}left:${bx}px;top:${by}px">${INI[own]}</span>`:'');
  }).join('');
  const bk=s=>G.over?G.hands[s].map(t=>dom(t.a,t.b,false,'r')).join(''):'<i></i>'.repeat(G.hands[s].length);
  const seat=s=>`<div class="abs seat ${'.wne'[s]}${G.turn===s&&!G.over?' turn':''}"><div class="bk"><span class="nm">${G.over&&sv===s?'👑 ':''}${s===2?'Noord (maat)':SHORT[s]}</span>${G.over?`<span class="pts">${tot(s)} stippen</span>`:ps.has(s)?`<div class="pas${lp===s?' pop':''}" role="img" aria-label="gepast">P</div>`:''}${bk(s)}</div></div>`;
  const ps=new Set(G.hist.slice(-3).filter(h=>!h.o).map(h=>h.seat));
  const status=G.over?'':G.sel!==null?'Kies waar de steen moet komen':G.note?G.note:G.turn?`${SHORT[G.turn]} denkt na…`:mv.length?(c.length?'Jij bent aan de beurt':'Leg een steen naar keuze'):'Je kunt niet leggen: tik op tafel';
  const t=G.over&&G.over.team;
  const sv=G.over?G.over.seat:null,tot=s=>G.hands[s].reduce((n,x)=>n+x.a+x.b,0),wt=tot(0)+tot(2),zt=tot(1)+tot(3);
  const head=!G.over?'':done?(t===0?'Wedstrijd gewonnen!':'Wedstrijd verloren'):G.over.dos?'Dos cabes!':sv===null?'Dicht!':sv===0?'Jij bent uit!':`${SHORT[sv]} is uit!`;
  const sub=!G.over?'':done?`Stand: wij ${wins[0]} – ${wins[1]} zij${G.over.dos?' · dos cabes!':''}`:t===null?'Gelijk: niemand krijgt een punt':sv===null?`Wij ${wt} – ${zt} zij: het laagste telt`:G.over.dos?`Aan beide kanten aanleggen: dubbele punten voor ${t===0?'ons':'hen'}`:t===0?'Ronde voor ons':'Ronde voor hen';
  const dots=k=>`<div class="dots"><span>${k?'Zij':'Wij'}</span>${Array.from({length:need},(_,i)=>`<i class="${i<wins[k]?'on t'+k:''}"></i>`).join('')}</div>`;
  const showFx=G.over&&!G.fx;if(G.over)G.fx=true;
  const nc=showFx&&t===0?(done?90:G.over.dos?60:36):0,CC=['#e0b04a','#ef8d78','#fff','#7fd1ae','#9db8ff'];
  const fx=showFx?`<div class="abs fx"><div class="abs rib ${t===0?'':t===null?'g':'l'}">${head}<small>${sub}</small></div>${Array.from({length:nc},(_,i)=>`<i class="cf" style="left:${Math.random()*100}%;background:${CC[i%5]};animation-delay:${Math.random()*.8}s;animation-duration:${2.2+Math.random()*1.6}s"></i>`).join('')}</div>`:'';
  const endp=G.over?`<div class="abs mine"><span class="nm">${sv===0?'👑 ':''}Zuid</span><span class="pts">${tot(0)} stippen</span></div><div class="abs ctl"><h3>${head}</h3><div>${sub}</div><button class="go" onclick="${done?'reset()':'deal()'}">${done?'Nieuwe wedstrijd':'Volgende ronde'}</button></div>`:'';
  a.innerHTML=`<div class="abs score">${dots(0)}${dots(1)}Best of ${S.bestOf} · ronde ${round} · ${S.ccw?'↺':'↻'}</div>
<button class="abs quit" onclick="reset()" aria-label="Stoppen">✕</button>
<button class="abs quit info" onclick="toggleInfo()" aria-label="Uitleg">i</button>
${seat(1)}${seat(2)}${seat(3)}
<div class="abs board" style="transform:scale(${bf});transform-origin:348px 125px">${its.length?stones:'<p class="empty">De tafel is nog leeg</p>'}</div>

<div class="abs hand${G.over?' end':''}">${G.hands[0].map((s,i)=>`<button class="st${mine&&ok.has(i)?' ok':''}${mine&&!ok.has(i)?' no':''}${G.sel===i?' sel':''}" ${mine?'':'disabled'} onclick="pick(${i})" aria-label="Steen ${s.a}-${s.b}">${dom(s.a,s.b,1)}</button>`).join('')}</div>
${G.over?endp:`<div class="abs ctl"><div>${status}</div><button class="tik" onclick="tik()" ${mine&&!mv.length?'':'disabled'}>Tik op tafel (pas)</button></div>`}${fx}${infoHTML()}`;
}
fit();render();addEventListener('resize',fit);
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))</script>
</body>
</html>
